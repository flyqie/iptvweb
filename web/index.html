<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080b12">
    <title>IPTV Player</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/vendor/hls.min.js" defer></script>
    <script src="/js/vendor/mpegts.min.js" defer></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="频道导航">
            <header class="sidebar-header">
                <div class="brand">
                    <div class="brand-mark" aria-hidden="true">TV</div>
                    <div>
                        <p class="eyebrow">STREAM HUB</p>
                        <h1>IPTV Player</h1>
                    </div>
                </div>
                <button class="sidebar-close" id="sidebarClose" type="button" aria-label="收起频道列表">收起</button>
                <div class="sidebar-stats" aria-live="polite">
                    <span id="channelCount">0 个频道</span>
                    <span class="status-dot"><span id="connectionStatus">就绪</span></span>
                </div>
                <div class="update-section">
                    <button id="updateBtn" class="primary-button" type="button">
                        <span class="button-icon" aria-hidden="true"></span>
                        <span>手动更新</span>
                    </button>
                    <span id="updateStatus" class="status-text" role="status">等待加载</span>
                </div>
            </header>

            <div class="search-box">
                <label class="sr-only" for="searchInput">搜索频道</label>
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input type="search" id="searchInput" placeholder="搜索频道或分组" autocomplete="off" spellcheck="false">
                <kbd>/</kbd>
            </div>

            <div class="channel-summary">
                <span>频道列表</span>
                <span id="visibleCount" class="summary-count">0</span>
            </div>
            <div class="channel-list-wrap">
                <ul id="channelList" class="channel-list" role="listbox" aria-label="频道列表">
                    <li class="state-row loading">正在加载频道...</li>
                </ul>
            </div>
            <footer class="sidebar-footer">
                <span class="footer-mark" aria-hidden="true"></span>
                <span>选择频道开始播放</span>
            </footer>
        </aside>

        <main class="player-area">
            <header class="player-toolbar">
                <div class="now-playing" aria-live="polite">
                    <span class="live-indicator" aria-hidden="true"></span>
                    <span id="channelName">未选择频道</span>
                </div>
                <button class="menu-toggle" id="menuToggle" type="button" aria-label="打开频道列表" aria-controls="sidebar" aria-expanded="false">频道列表</button>
            </header>

            <section class="player-shell" aria-label="视频播放器">
                <video id="player" controls controlsList="nodownload noplaybackrate" disablepictureinpicture playsinline preload="metadata"></video>
                <div id="playerEmpty" class="player-empty">
                    <div class="empty-mark" aria-hidden="true">TV</div>
                    <h2>准备好播放</h2>
                    <p>从左侧选择一个频道开始观看</p>
                    <button id="openChannelsBtn" class="secondary-button" type="button">浏览频道</button>
                </div>
            </section>
            <div id="channelInfo" class="channel-info" role="status" aria-live="polite" hidden>
                <span id="channelInfoText"></span>
            </div>
        </main>
    </div>

    <div class="overlay" id="overlay" aria-hidden="true"></div>
    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
    <script src="/js/app.js" defer></script>
</body>
</html>
